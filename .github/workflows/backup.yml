name: Backup

# Weekly logical backup of the production database, kept as a workflow
# artifact. Supabase keeps its own daily physical backups (7 days, Pro plan);
# this is the off-site copy for the case where the project itself is lost.

on:
  schedule:
    - cron: '0 2 * * 1' # Mondays, 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    name: Dump database
    runs-on: ubuntu-latest
    steps:
      # Production runs Postgres 17.6, so the client must be 17.x too —
      # pg_dump refuses to work across a major version.
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo wget -qO /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 > /dev/null
          # The unversioned /usr/bin/pg_dump still points at 16, so use the
          # versioned binary explicitly.
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set"
            exit 1
          fi
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          # public only: Supabase does not let the backup role read the auth or
          # storage schemas, so the auth users are only covered by Supabase's
          # own physical backups. This file is the app data — orders, menus,
          # guests, settings and the M-Pesa ledger.
          PG_DUMP=/usr/lib/postgresql/17/bin/pg_dump
          "$PG_DUMP" "$SUPABASE_DB_URL" \
            --schema=public \
            --no-owner --no-privileges \
            --format=custom \
            --file="manipos-${STAMP}.dump"
          ls -lh manipos-*.dump

      - name: Record row counts
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # A manifest the verification job compares a restored copy against,
          # so a truncated or stale dump is caught rather than trusted.
          SQL=$(/usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -Atc "select string_agg(format('select %L as t, count(*) as c from public.%I', tablename, tablename), ' union all ') from pg_tables where schemaname='public'")
          /usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -AtF'|' -c "$SQL order by 1" > row_counts.txt
          wc -l row_counts.txt

      - name: Upload dump
        uses: actions/upload-artifact@v4
        with:
          name: manipos-db-${{ github.run_number }}
          path: |
            manipos-*.dump
            row_counts.txt
          retention-days: 90

      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=❌ ManiPOS weekly database backup FAILED (run ${{ github.run_number }})."

  verify:
    # Restores the dump into a throwaway Postgres and compares every table's
    # row count against the manifest the dump job recorded. A backup that
    # cannot be restored is not a backup, so this runs automatically.
    name: Verify restore
    needs: dump
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scratch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # Must match the postgres:17 service container.
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo wget -qO /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 > /dev/null
          /usr/lib/postgresql/17/bin/pg_restore --version

      - name: Download backup
        uses: actions/download-artifact@v4
        with:
          name: manipos-db-${{ github.run_number }}
          path: backup

      - name: Restore into scratch database
        env:
          SCRATCH_URL: postgresql://postgres:postgres@localhost:5432/scratch
        run: |
          ls -lh backup/
          # The dump references Supabase's roles and auth.jwt() in its RLS
          # policies, neither of which a plain Postgres has. Create them, and
          # start from an empty public schema so CREATE SCHEMA does not error.
          /usr/lib/postgresql/17/bin/psql "$SCRATCH_URL" -q \
            -c "create role anon nologin;" \
            -c "create role authenticated nologin;" \
            -c "create role service_role nologin bypassrls;" \
            -c "create schema if not exists auth;" \
            -c "create or replace function auth.jwt() returns jsonb language sql stable as \$\$ select '{}'::jsonb \$\$;" \
            -c "create extension if not exists pgcrypto;" \
            -c "create extension if not exists \"uuid-ossp\";" \
            -c "create extension if not exists pg_trgm;" \
            -c "drop schema public cascade;"
          /usr/lib/postgresql/17/bin/pg_restore --no-owner --no-privileges --dbname="$SCRATCH_URL" backup/manipos-*.dump

      - name: Compare row counts
        env:
          SCRATCH_URL: postgresql://postgres:postgres@localhost:5432/scratch
        run: |
          SQL=$(/usr/lib/postgresql/17/bin/psql "$SCRATCH_URL" -Atc "select string_agg(format('select %L as t, count(*) as c from public.%I', tablename, tablename), ' union all ') from pg_tables where schemaname='public'")
          /usr/lib/postgresql/17/bin/psql "$SCRATCH_URL" -AtF'|' -c "$SQL order by 1" > restored_counts.txt
          if diff -u backup/row_counts.txt restored_counts.txt; then
            echo "✅ Restored copy matches the source row counts."
          else
            echo "::error::Restored row counts differ from the backup manifest"
            exit 1
          fi

      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=❌ ManiPOS backup RESTORE VERIFICATION FAILED (run ${{ github.run_number }}). The dump exists but did not restore or did not match."
