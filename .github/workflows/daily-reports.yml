name: Daily reports

# Emails each restaurant's daily sales, platform commission and closing-stock
# reports to the addresses the owner registered in the Storefront editor.
# Runs 21:17 UTC = 00:17 Africa/Nairobi.

on:
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send daily reports
        env:
          CRON_SECRET: ${{ secrets.DAILY_REPORTS_CRON_SECRET }}
        run: |
          curl -sS -X POST \
            "https://ptaqejtyhdbhmhrhuxcj.supabase.co/functions/v1/daily-reports" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}'
