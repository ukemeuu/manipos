<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ManiPOS · You are offline</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: #0f172a; color: #e2e8f0; padding: 24px;
    }
    .card { max-width: 440px; text-align: center; }
    .logo {
      width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 18px;
      background: #fbbf24; color: #0f172a; display: grid; place-items: center;
      font-weight: 900; font-size: 32px;
    }
    h1 { font-size: 26px; margin: 0 0 8px; letter-spacing: -0.02em; }
    p { color: #94a3b8; line-height: 1.6; font-size: 14px; margin: 0 0 20px; }
    .badge {
      display: inline-block; padding: 6px 12px; border-radius: 999px;
      background: rgba(251, 191, 36, 0.12); border: 1px solid rgba(251, 191, 36, 0.3);
      color: #fbbf24; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em;
      margin-bottom: 16px;
    }
    button {
      width: 100%; padding: 14px; border: 0; border-radius: 12px; cursor: pointer;
      background: #fbbf24; color: #0f172a; font-weight: 900; font-size: 14px;
    }
    small { display: block; margin-top: 18px; color: #64748b; font-size: 11px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">M</div>
    <div class="badge">Offline mode</div>
    <h1>You are offline</h1>
    <p>ManiPOS keeps selling offline. New orders are stored on this device and will sync automatically as soon as your connection returns.</p>
    <button onclick="window.location.reload()">Try again</button>
    <small>Need help? support@manipos.com</small>
  </div>
</body>
</html>
